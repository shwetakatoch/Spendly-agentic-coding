{% extends "base.html" %}

{% block title %}{{ form_title }} — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">{{ form_title }}</h1>
            <p class="auth-subtitle">{{ form_subtitle }}</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ action_url }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-input"
                           step="0.01" min="0.01" placeholder="0.00"
                           value="{{ values.get('amount', '') }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled{% if not values.get('category') %} selected{% endif %}>Choose a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}"{% if values.get('category') == c %} selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           max="{{ today }}" value="{{ values.get('date', today) }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description" class="form-input"
                           maxlength="{{ max_description }}" placeholder="e.g. Lunch with team"
                           value="{{ values.get('description', '') }}">
                </div>
                <button type="submit" class="btn-submit">{{ submit_label }}</button>
            </form>
        </div>

        <p class="auth-switch"><a href="{{ url_for('profile') }}">Cancel</a></p>

    </div>
</section>

{% endblock %}
